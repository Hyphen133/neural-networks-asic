# Tiny Tapeout project information
project:
  title:        "Sheila Wake-Word Spotter"
  author:       "Jedrzej Hasiura"
  discord:      ""
  description:  "Self-contained keyword spotter: PDM mic in, LED out. No host, no memory, no weights to load."
  language:     "SystemVerilog"
  clock_hz:     50000000

  # ~24.0k um^2 of cells in a 31.3k um^2 tile = 77% utilisation. Above
  # OpenLane's 60% default, so raise FP_CORE_UTIL; the ttihp template notes
  # densities up to ~80% have routed. See wakeword/area_check.sh.
  tiles: "1x1"

  top_module:  "tt_um_wakeword"

  source_files:
    - "tt_um_wakeword.sv"

pinout:
  ui[0]: "PDM microphone data in"
  ui[1]: "threshold trim bit 0 (LSB) - DIP switch"
  ui[2]: "threshold trim bit 1"
  ui[3]: "threshold trim bit 2"
  ui[4]: "threshold trim bit 3"
  ui[5]: "threshold trim bit 4"
  ui[6]: "threshold trim bit 5"
  ui[7]: "threshold trim bit 6 (MSB) - 64 = no trim"

  uo[0]: "PDM microphone clock out (1.5625 MHz)"
  uo[1]: "detect - LED"
  uo[2]: "detect (mirror)"
  uo[3]: "detect (mirror)"
  uo[4]: "debug: band-0 level bit 0"
  uo[5]: "debug: band-0 level bit 1"
  uo[6]: "debug: band-0 level bit 2"
  uo[7]: "debug: band-0 level bit 3"

  uio[0]: "debug: frame index bit 0"
  uio[1]: "debug: frame index bit 1"
  uio[2]: "debug: frame index bit 2"
  uio[3]: "debug: frame index bit 3"
  uio[4]: "debug: detect"
  uio[5]: "debug: FSM state bit 0"
  uio[6]: "debug: FSM state bit 1"
  uio[7]: "debug: mic tick"

yaml_version: 6
